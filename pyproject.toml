[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "wellness-metrics-dashboard"
version = "0.1.0"
description = "Local-first ETL pipeline for MyFitnessPal and Apple Health exports."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "pandas>=2.2.0",
    "python-dotenv>=1.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
]

[tool.setuptools.packages.find]
include = ["src*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
norecursedirs = ["work", ".venv", "venv", "data", "dashboard", "notebooks", "outputs"]
pythonpath = ["."]
